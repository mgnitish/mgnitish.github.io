<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InsureIQ — Know Your Coverage</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { margin: 0; font-family: 'DM Sans', 'Segoe UI', sans-serif; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  
</style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const formatINR = (n) => {
      if (n >= 10000000) return `₹${(n / 10000000).toFixed(1)}Cr`;
      if (n >= 100000) return `₹${(n / 100000).toFixed(1)}L`;
      if (n >= 1000) return `₹${(n / 1000).toFixed(0)}K`;
      return `₹${n}`;
    };
    const formatINRFull = (n) => "₹" + n.toLocaleString("en-IN");

    // ── Theme Definitions ──
    const themes = {
      dark: {
        bg: "linear-gradient(145deg, #020617 0%, #0f172a 50%, #020617 100%)",
        text: "#f1f5f9", textSecondary: "#cbd5e1", textMuted: "#94a3b8", textDim: "#64748b", textFaint: "#475569",
        cardBg: "linear-gradient(180deg, rgba(15,23,42,0.85) 0%, rgba(30,41,59,0.9) 100%)", cardBorder: "#334155", cardShadow: "0 20px 60px rgba(0,0,0,0.4)",
        inputBg: "#0f172a", inputBorder: "#334155",
        pillBg: "linear-gradient(135deg, #1e3a5f, #1e293b)", pillBorder: "#334155",
        barTrack: "#1e293b", divider: "#1e293b", rowBg: "#0f172a",
        disclaimerBg: "#0c1425", disclaimerBorder: "#1e293b",
        stepActiveBg: "#1e40af", stepDoneBg: "#164e63", stepDefaultBg: "#1e293b",
        stepDotDone: "#22c55e", stepDotActive: "#3b82f6", stepDotDefault: "#334155",
        h1Gradient: "linear-gradient(135deg, #e2e8f0, #64748b)",
        checkActiveBg: "#1e293b", checkActiveBorder: "#3b82f6",
        tierMetBgSuffix: "10", tierDefaultBg: "#0f172a",
        coverRowBg: "#0c1425", coverRowBorder: "#334155",
        btnPrimaryBg: "linear-gradient(135deg, #2563eb, #1d4ed8)", btnPrimaryShadow: "0 4px 16px rgba(37,99,235,0.3)",
        btnSecondaryBg: "transparent", btnSecondaryBorder: "#334155", btnSecondaryColor: "#94a3b8", btnDisabledColor: "#334155",
        gaugeBg: "#1e293b", tableBorder: "#334155",
      },
      light: {
        bg: "linear-gradient(145deg, #f8fafc 0%, #e2e8f0 50%, #f8fafc 100%)",
        text: "#0f172a", textSecondary: "#334155", textMuted: "#475569", textDim: "#64748b", textFaint: "#94a3b8",
        cardBg: "linear-gradient(180deg, rgba(255,255,255,0.82) 0%, rgba(248,250,252,0.88) 100%)", cardBorder: "#cbd5e1", cardShadow: "0 20px 60px rgba(0,0,0,0.06)",
        inputBg: "#f1f5f9", inputBorder: "#cbd5e1",
        pillBg: "linear-gradient(135deg, #dbeafe, #eff6ff)", pillBorder: "#93c5fd",
        barTrack: "#e2e8f0", divider: "#e2e8f0", rowBg: "#f1f5f9",
        disclaimerBg: "#f8fafc", disclaimerBorder: "#e2e8f0",
        stepActiveBg: "#2563eb", stepDoneBg: "#0e7490", stepDefaultBg: "#e2e8f0",
        stepDotDone: "#16a34a", stepDotActive: "#2563eb", stepDotDefault: "#cbd5e1",
        h1Gradient: "linear-gradient(135deg, #0f172a, #475569)",
        checkActiveBg: "#eff6ff", checkActiveBorder: "#3b82f6",
        tierMetBgSuffix: "18", tierDefaultBg: "#f1f5f9",
        coverRowBg: "#f8fafc", coverRowBorder: "#cbd5e1",
        btnPrimaryBg: "linear-gradient(135deg, #2563eb, #1d4ed8)", btnPrimaryShadow: "0 4px 16px rgba(37,99,235,0.18)",
        btnSecondaryBg: "#ffffff", btnSecondaryBorder: "#cbd5e1", btnSecondaryColor: "#475569", btnDisabledColor: "#d1d5db",
        gaugeBg: "#e2e8f0", tableBorder: "#cbd5e1",
      },
    };

    // ── Gauge ──
    function ScoreGauge({ score, t }) {
      const r = 80, circ = 2 * Math.PI * r;
      const offset = circ * (1 - (score / 100) * 0.75);
      const color = score >= 75 ? "#22c55e" : score >= 50 ? "#eab308" : score >= 25 ? "#f97316" : "#ef4444";
      return (
        <div style={{ position: "relative", width: 200, height: 160, margin: "0 auto" }}>
          <svg width="200" height="160" viewBox="0 0 200 160">
            <path d="M 20 140 A 80 80 0 1 1 180 140" fill="none" stroke={t.gaugeBg} strokeWidth="14" strokeLinecap="round" />
            <path d="M 20 140 A 80 80 0 1 1 180 140" fill="none" stroke={color} strokeWidth="14" strokeLinecap="round"
              strokeDasharray={circ * 0.75} strokeDashoffset={offset}
              style={{ transition: "stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1), stroke 0.4s" }} />
          </svg>
          <div style={{ position: "absolute", bottom: 12, left: "50%", transform: "translateX(-50%)", textAlign: "center" }}>
            <div style={{ fontSize: 42, fontWeight: 800, color, lineHeight: 1, fontFamily: "'DM Mono', monospace" }}>{score}</div>
            <div style={{ fontSize: 11, color: t.textMuted, letterSpacing: 2, textTransform: "uppercase", marginTop: 2 }}>out of 100</div>
          </div>
        </div>
      );
    }

    // ── Bar ──
    function GapBar({ label, current, recommended, t }) {
      const pct = recommended > 0 ? Math.min((current / recommended) * 100, 100) : 0;
      const color = pct >= 80 ? "#22c55e" : pct >= 50 ? "#eab308" : "#ef4444";
      return (
        <div style={{ marginBottom: 18 }}>
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
            <span style={{ fontSize: 13, fontWeight: 600, color: t.text }}>{label}</span>
            <span style={{ fontSize: 12, color: t.textMuted }}>{formatINR(current)} / {formatINR(recommended)}</span>
          </div>
          <div style={{ height: 10, background: t.barTrack, borderRadius: 5, overflow: "hidden" }}>
            <div style={{ width: `${pct}%`, height: "100%", background: `linear-gradient(90deg, ${color}cc, ${color})`, borderRadius: 5, transition: "width 1s cubic-bezier(.4,0,.2,1)" }} />
          </div>
        </div>
      );
    }

    // ── Inputs ──
    function Field({ label, sub, value, onChange, placeholder, prefix, t, required, error }) {
      return (
        <div style={{ marginBottom: 16 }}>
          <label style={{ display: "block", fontSize: 13, fontWeight: 600, color: t.textSecondary, marginBottom: 4 }}>
            {label}
            {required && <span style={{ color: "#ef4444", marginLeft: 3 }}>*</span>}
            {sub && <span style={{ fontWeight: 400, color: t.textDim, marginLeft: 6, fontSize: 11 }}>{sub}</span>}
          </label>
          <div style={{ position: "relative" }}>
            {prefix && <span style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: error ? "#ef4444" : t.textDim, fontSize: 14, fontWeight: 600 }}>{prefix}</span>}
            <input type="number" value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder}
              style={{ width: "100%", padding: prefix ? "10px 12px 10px 28px" : "10px 12px", background: t.inputBg, border: `1px solid ${error ? "#ef4444" : t.inputBorder}`, borderRadius: 8, color: t.text, fontSize: 14, outline: "none", boxSizing: "border-box", fontFamily: "'DM Mono', monospace", transition: "background 0.3s, border-color 0.3s, color 0.3s" }} />
          </div>
          {error && <div style={{ fontSize: 11, color: "#ef4444", marginTop: 4 }}>{error}</div>}
        </div>
      );
    }

    function CheckItem({ label, checked, onChange, sub, t }) {
      return (
        <label style={{ display: "flex", alignItems: "flex-start", gap: 10, padding: "10px 14px", background: checked ? t.checkActiveBg : "transparent", border: `1px solid ${checked ? t.checkActiveBorder : t.inputBorder}`, borderRadius: 10, cursor: "pointer", marginBottom: 8, transition: "all 0.25s" }}>
          <input type="checkbox" checked={checked} onChange={(e) => onChange(e.target.checked)} style={{ marginTop: 2, accentColor: "#3b82f6" }} />
          <div>
            <div style={{ fontSize: 13, fontWeight: 600, color: t.text }}>{label}</div>
            {sub && <div style={{ fontSize: 11, color: t.textDim, marginTop: 2 }}>{sub}</div>}
          </div>
        </label>
      );
    }

    function SelectField({ label, value, onChange, options, t }) {
      return (
        <div style={{ marginBottom: 16 }}>
          <label style={{ display: "block", fontSize: 13, fontWeight: 600, color: t.textSecondary, marginBottom: 4 }}>{label}</label>
          <select value={value} onChange={(e) => onChange(e.target.value)}
            style={{ width: "100%", padding: "10px 12px", background: t.inputBg, border: `1px solid ${t.inputBorder}`, borderRadius: 8, color: t.text, fontSize: 14, outline: "none", fontFamily: "'DM Mono', monospace", transition: "background 0.3s, border-color 0.3s, color 0.3s" }}>
            {options.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
          </select>
        </div>
      );
    }

    // ── Theme Toggle ──
    function ThemeToggle({ isDark, onToggle }) {
      return (
        <button onClick={onToggle} aria-label="Toggle theme"
          style={{
            position: "fixed", top: 16, right: 16, zIndex: 100, width: 48, height: 48, borderRadius: 14,
            border: `1.5px solid ${isDark ? "#334155" : "#cbd5e1"}`,
            background: isDark ? "linear-gradient(135deg, #1e293b, #0f172a)" : "linear-gradient(135deg, #ffffff, #f1f5f9)",
            color: isDark ? "#fbbf24" : "#6366f1",
            fontSize: 22, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
            boxShadow: isDark ? "0 4px 24px rgba(0,0,0,0.4)" : "0 4px 24px rgba(0,0,0,0.08)",
            transition: "all 0.4s cubic-bezier(.4,0,.2,1)",
          }}>
          <span style={{ display: "inline-block", transition: "transform 0.5s cubic-bezier(.4,0,.2,1)", transform: isDark ? "rotate(0deg) scale(1)" : "rotate(220deg) scale(1)" }}>
            {isDark ? "☀️" : "🌙"}
          </span>
        </button>
      );
    }

    // ── Analysis Engine ──
    function analyze(data) {
      const income = Number(data.income) || 0;
      const liabilities = Number(data.liabilities) || 0;
      const dependents = Number(data.dependents) || 0;

      const lifeTiers = {
        conservative: { label: "Conservative", sub: "The Safety Net", multiplier: "12–15× Income", target: income * 15 + liabilities, color: "#22c55e", icon: "🛡" },
        balanced:     { label: "Balanced",     sub: "The Standard",   multiplier: "10× Income + Debts", target: income * 10 + liabilities, color: "#3b82f6", icon: "⚖️" },
        lean:         { label: "Lean",         sub: "The Minimum",    multiplier: "5× Income + Debts",  target: income * 5 + liabilities,  color: "#eab308", icon: "📉" },
      };
      const lifeTarget = lifeTiers.balanced.target;

      let lifeCover = 0;
      const lifeBreakdown = [];
      if (data.hasTermPlan) { const v = Number(data.termPlanSA) || 0; lifeCover += v; lifeBreakdown.push({ name: "Term Plan", value: v, type: "good" }); }
      if (data.hasPMJJBY) { lifeCover += 200000; lifeBreakdown.push({ name: "PMJJBY", value: 200000, type: "weak" }); }
      if (data.hasEndowment) { const v = Number(data.endowmentSA) || 0; lifeCover += v; lifeBreakdown.push({ name: "Endowment/Traditional (SA only)", value: v, type: "caution" }); }
      if (data.hasULIP) { const v = Number(data.ulipSA) || 0; lifeCover += v; lifeBreakdown.push({ name: "ULIP (SA only, excl. fund value)", value: v, type: "caution" }); }
      if (data.hasSinglePremium) { const v = Number(data.singlePremiumSA) || 0; lifeCover += v; lifeBreakdown.push({ name: "Single Premium Plan (SA)", value: v, type: "caution" }); }
      const lifeScore = lifeTarget > 0 ? Math.min((lifeCover / lifeTarget) * 100, 100) : 0;

      const isMetro = data.cityTier === "metro";
      let medTarget = dependents === 0 ? (isMetro ? 1000000 : 500000) : dependents <= 2 ? (isMetro ? 1500000 : 1000000) : (isMetro ? 2500000 : 1500000);
      let medCover = 0; const medBreakdown = [];
      if (data.hasPersonalHealth) { const v = Number(data.personalHealthSA) || 0; medCover += v; medBreakdown.push({ name: "Personal Health Insurance", value: v, type: "good" }); }
      if (data.hasEmployerHealth) { const v = Number(data.employerHealthSA) || 0; medCover += v; medBreakdown.push({ name: "Employer Health Cover", value: v, type: "caution" }); }
      if (data.hasPMAY) { medCover += 500000; medBreakdown.push({ name: "PMJAY/Govt. Scheme", value: 500000, type: "weak" }); }
      if (data.hasSuperTopUp) { const v = Number(data.superTopUpSA) || 0; medCover += v; medBreakdown.push({ name: "Super Top-Up", value: v, type: "good" }); }
      const medScore = medTarget > 0 ? Math.min((medCover / medTarget) * 100, 100) : 0;

      const accTarget = income * 7;
      let accCover = 0; const accBreakdown = [];
      if (data.hasStandalonePA) { const v = Number(data.standalonePASA) || 0; accCover += v; accBreakdown.push({ name: "Standalone PA Cover", value: v, type: "good" }); }
      if (data.hasPMSBY) { accCover += 200000; accBreakdown.push({ name: "PMSBY", value: 200000, type: "weak" }); }
      if (data.hasAccidentRider) { const v = Number(data.accidentRiderSA) || 0; accCover += v; accBreakdown.push({ name: "Accident Rider", value: v, type: "good" }); }
      const accScore = accTarget > 0 ? Math.min((accCover / accTarget) * 100, 100) : 0;

      const overall = Math.round(lifeScore * 0.5 + medScore * 0.3 + accScore * 0.2);

      const recs = [];
      if (income > 0 && lifeScore < 60) {
        if (lifeCover < lifeTiers.lean.target) {
          recs.push({ severity: "critical", text: `Your life cover (${formatINR(lifeCover)}) doesn't meet the Lean minimum of ${formatINR(lifeTiers.lean.target)}. You urgently need a pure Term Plan — start with at least ${formatINR(lifeTiers.lean.target - lifeCover)} additional cover, and aim for the Balanced target of ${formatINR(lifeTiers.balanced.target)}.` });
        } else {
          recs.push({ severity: "critical", text: `Your life cover (${formatINR(lifeCover)}) meets the Lean tier but falls short of Balanced (${formatINR(lifeTiers.balanced.target)}). Purchase a Term Plan for the gap of ${formatINR(lifeTiers.balanced.target - lifeCover)}.` });
        }
      } else if (income > 0 && lifeScore < 90) {
        const conGap = lifeTiers.conservative.target - lifeCover;
        if (conGap > 0) recs.push({ severity: "moderate", text: `You're near Balanced but ${formatINR(conGap)} short of the Conservative safety-net (${formatINR(lifeTiers.conservative.target)}). Consider topping up if you have dependents or volatile income.` });
      }
      if (data.hasPMJJBY && !data.hasTermPlan) recs.push({ severity: "critical", text: "PMJJBY provides only ₹2L cover — far too low for primary life insurance. Get a proper Term Plan immediately." });
      if (data.hasEndowment || data.hasULIP) recs.push({ severity: "moderate", text: "Traditional/Endowment & ULIP plans offer poor SA relative to premium. Consider surrendering (post lock-in) and redirecting premiums to a Term Plan + mutual funds." });
      if (medScore < 60) recs.push({ severity: "critical", text: `Medical cover gap of ${formatINR(medTarget - medCover)}. Purchase a personal family floater or Super Top-Up plan.` });
      if (data.hasEmployerHealth && !data.hasPersonalHealth) recs.push({ severity: "critical", text: "You rely solely on employer health cover, which ends when you leave/lose your job. Get a personal health policy now." });
      if (accScore < 40) recs.push({ severity: "critical", text: `Accident/Disability cover is severely inadequate at ${formatINR(accCover)}. Get a standalone PA policy with PTD benefits of at least ${formatINR(accTarget)}.` });
      if (data.hasPMSBY && !data.hasStandalonePA) recs.push({ severity: "moderate", text: "PMSBY only provides ₹2L accident cover. Insufficient for your income level. Add a standalone PA policy." });
      if (dependents > 0 && !data.hasCriticalIllness) recs.push({ severity: "moderate", text: "With dependents, consider adding a Critical Illness rider or standalone policy for lump-sum payouts on major diagnoses." });
      if (recs.length === 0) recs.push({ severity: "good", text: "Your insurance portfolio looks well-structured. Review annually as income and liabilities change." });

      const noCover = lifeCover === 0 && medCover === 0 && accCover === 0;

      return {
        overall,
        noCover,
        life: { cover: lifeCover, target: lifeTarget, score: Math.round(lifeScore), breakdown: lifeBreakdown, tiers: lifeTiers },
        medical: { cover: medCover, target: medTarget, score: Math.round(medScore), breakdown: medBreakdown },
        accident: { cover: accCover, target: accTarget, score: Math.round(accScore), breakdown: accBreakdown },
        recs,
      };
    }

    // ── Main App ──
    function InsuranceAnalyzer() {
      const [isDark, setIsDark] = useState(true);
      const [step, setStep] = useState(0);
      const [data, setData] = useState({
        age: "", dependents: "", income: "", expenses: "", liabilities: "", cityTier: "metro",
        hasTermPlan: false, termPlanSA: "", hasPMJJBY: false, hasEndowment: false, endowmentSA: "",
        hasULIP: false, ulipSA: "", hasSinglePremium: false, singlePremiumSA: "",
        hasPersonalHealth: false, personalHealthSA: "", hasEmployerHealth: false, employerHealthSA: "",
        hasPMAY: false, hasSuperTopUp: false, superTopUpSA: "",
        hasStandalonePA: false, standalonePASA: "", hasPMSBY: false,
        hasAccidentRider: false, accidentRiderSA: "", hasCriticalIllness: false,
      });
      const [result, setResult] = useState(null);
      const [animScore, setAnimScore] = useState(0);
      const [errors, setErrors] = useState({});

      const t = themes[isDark ? "dark" : "light"];
      const s = (k) => (v) => setData((d) => ({ ...d, [k]: v }));

      const next = () => {
        if (step === 0) {
          const errs = {};
          if (!data.age || Number(data.age) <= 0) errs.age = "Please enter your age";
          if (!data.income || Number(data.income) <= 0) errs.income = "Annual income is required for analysis";
          if (Object.keys(errs).length > 0) { setErrors(errs); return; }
          setErrors({});
        }
        if (step === 3) { const r = analyze(data); setResult(r); setAnimScore(0); setStep(4); setTimeout(() => setAnimScore(r.noCover ? 0 : r.overall), 100); }
        else setStep((x) => x + 1);
      };
      const back = () => setStep((x) => Math.max(x - 1, 0));

      const stepLabels = ["Profile", "Life", "Medical", "Accident", "Report"];
      const sevColor = { critical: "#ef4444", moderate: "#eab308", good: "#22c55e" };
      const sevIcon = { critical: "⚠", moderate: "◉", good: "✓" };
      const typeColor = { good: "#22c55e", caution: "#eab308", weak: "#f97316" };

      return (
        <div style={{ minHeight: "100vh", position: "relative", overflow: "hidden", color: t.text, fontFamily: "'DM Sans', 'Segoe UI', sans-serif", transition: "color 0.3s" }}>

          {/* ── Layered Background ── */}
          <div style={{ position: "fixed", inset: 0, background: t.bg, transition: "background 0.6s", zIndex: 0 }} />

          <div style={{ position: "fixed", inset: 0, zIndex: 0, overflow: "hidden", opacity: isDark ? 0.4 : 0.3, transition: "opacity 0.6s" }}>
            <div style={{ position: "absolute", top: "-10%", left: "-10%", width: "50%", height: "50%", borderRadius: "50%", background: isDark ? "radial-gradient(circle, #1e40af55 0%, transparent 70%)" : "radial-gradient(circle, #93c5fd44 0%, transparent 70%)", filter: "blur(80px)" }} />
            <div style={{ position: "absolute", bottom: "-15%", right: "-10%", width: "60%", height: "60%", borderRadius: "50%", background: isDark ? "radial-gradient(circle, #0e747055 0%, transparent 70%)" : "radial-gradient(circle, #67e8f944 0%, transparent 70%)", filter: "blur(100px)" }} />
            <div style={{ position: "absolute", top: "40%", left: "50%", transform: "translateX(-50%)", width: "40%", height: "40%", borderRadius: "50%", background: isDark ? "radial-gradient(circle, #7c3aed33 0%, transparent 70%)" : "radial-gradient(circle, #c4b5fd33 0%, transparent 70%)", filter: "blur(90px)" }} />
          </div>

          <div style={{ position: "fixed", inset: 0, zIndex: 0, opacity: isDark ? 0.06 : 0.04, backgroundImage: `linear-gradient(${isDark ? "#94a3b8" : "#475569"} 1px, transparent 1px), linear-gradient(90deg, ${isDark ? "#94a3b8" : "#475569"} 1px, transparent 1px)`, backgroundSize: "60px 60px" }} />

          <div style={{ position: "fixed", inset: 0, zIndex: 0, overflow: "hidden", pointerEvents: "none" }}>
            <svg style={{ position: "absolute", top: "8%", right: "8%", opacity: isDark ? 0.06 : 0.05 }} width="180" height="200" viewBox="0 0 180 200" fill="none">
              <path d="M90 10 L170 60 L170 150 L90 190 L10 150 L10 60 Z" stroke={isDark ? "#60a5fa" : "#3b82f6"} strokeWidth="1.5" fill="none" />
              <path d="M90 35 L150 70 L150 140 L90 170 L30 140 L30 70 Z" stroke={isDark ? "#60a5fa" : "#3b82f6"} strokeWidth="1" fill="none" opacity="0.5" />
              <path d="M90 60 L130 82 L130 128 L90 148 L50 128 L50 82 Z" stroke={isDark ? "#60a5fa" : "#3b82f6"} strokeWidth="0.8" fill="none" opacity="0.3" />
            </svg>
            <svg style={{ position: "absolute", bottom: "12%", left: "5%", opacity: isDark ? 0.05 : 0.04 }} width="140" height="160" viewBox="0 0 140 160" fill="none">
              <path d="M70 5 C70 5 130 30 130 75 C130 120 70 155 70 155 C70 155 10 120 10 75 C10 30 70 5 70 5Z" stroke={isDark ? "#22c55e" : "#16a34a"} strokeWidth="1.5" fill="none" />
              <path d="M70 25 C70 25 115 43 115 78 C115 113 70 140 70 140 C70 140 25 113 25 78 C25 43 70 25 70 25Z" stroke={isDark ? "#22c55e" : "#16a34a"} strokeWidth="1" fill="none" opacity="0.5" />
            </svg>
            <svg style={{ position: "absolute", top: "50%", left: "12%", opacity: isDark ? 0.04 : 0.03 }} width="100" height="100" viewBox="0 0 100 100" fill="none">
              <circle cx="50" cy="50" r="45" stroke={isDark ? "#eab308" : "#ca8a04"} strokeWidth="1" fill="none" />
              <circle cx="50" cy="50" r="30" stroke={isDark ? "#eab308" : "#ca8a04"} strokeWidth="0.8" fill="none" opacity="0.5" />
              <line x1="50" y1="15" x2="50" y2="38" stroke={isDark ? "#eab308" : "#ca8a04"} strokeWidth="0.8" opacity="0.4" />
              <line x1="50" y1="62" x2="50" y2="85" stroke={isDark ? "#eab308" : "#ca8a04"} strokeWidth="0.8" opacity="0.4" />
              <line x1="15" y1="50" x2="38" y2="50" stroke={isDark ? "#eab308" : "#ca8a04"} strokeWidth="0.8" opacity="0.4" />
              <line x1="62" y1="50" x2="85" y2="50" stroke={isDark ? "#eab308" : "#ca8a04"} strokeWidth="0.8" opacity="0.4" />

                <div style={{ display: "flex", justifyContent: "space-between", marginTop: 24 }}>
                  <button onClick={back} disabled={step === 0}
                    style={{ padding: "10px 20px", borderRadius: 8, border: `1px solid ${t.btnSecondaryBorder}`, background: t.btnSecondaryBg, color: step === 0 ? t.btnDisabledColor : t.btnSecondaryColor, fontSize: 13, fontWeight: 600, cursor: step === 0 ? "default" : "pointer", transition: "all 0.3s" }}>
                    ← Back
                  </button>
                  <button onClick={next}
                    style={{ padding: "10px 24px", borderRadius: 8, border: "none", background: t.btnPrimaryBg, color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer", boxShadow: t.btnPrimaryShadow, transition: "all 0.3s" }}>
                    {step === 3 ? "Generate Report →" : "Continue →"}
                  </button>
                </div>
              )}
              {step === 4 && (
                <div style={{ textAlign: "center", marginTop: 20 }}>
                  <button onClick={() => { setStep(0); setResult(null); setData({
                      age: "", dependents: "", income: "", expenses: "", liabilities: "", cityTier: "metro",
                      hasTermPlan: false, termPlanSA: "", hasPMJJBY: false, hasEndowment: false, endowmentSA: "",
                      hasULIP: false, ulipSA: "", hasSinglePremium: false, singlePremiumSA: "",
                      hasPersonalHealth: false, personalHealthSA: "", hasEmployerHealth: false, employerHealthSA: "",
                      hasPMAY: false, hasSuperTopUp: false, superTopUpSA: "",
                      hasStandalonePA: false, standalonePASA: "", hasPMSBY: false,
                      hasAccidentRider: false, accidentRiderSA: "", hasCriticalIllness: false,
                    }); }}
                    style={{ padding: "10px 24px", borderRadius: 8, border: `1px solid ${t.btnSecondaryBorder}`, background: t.btnSecondaryBg, color: t.btnSecondaryColor, fontSize: 13, fontWeight: 600, cursor: "pointer", transition: "all 0.3s" }}>
                    ↻ Start New Analysis
                  </button>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<InsuranceAnalyzer />);
  </script>
</body>
</html>
